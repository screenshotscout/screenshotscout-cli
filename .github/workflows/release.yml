# Publishes @screenshotscout/cli to npm when a vX.Y.Z tag is pushed, then creates
# the GitHub release from the tag message's body.
#
# Running it by hand (Actions > Release > Run workflow) is a dry run: it checks,
# tests and packs, and never publishes. Give it the new version to also check that
# package.json and package-lock.json say it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run only: fail unless package.json and package-lock.json say this version (for example 1.2.3)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # pretest builds; test/process/cli.test.ts also checks the version that --version prints.
      - run: npm test

      - name: Check that package.json and package-lock.json have the release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then expected="${GITHUB_REF_NAME#v}"; else expected="$INPUT_VERSION"; fi
          actual="$(node -p "require('./package.json').version")"
          lock="$(node -p "const l = require('./package-lock.json'); l.version + ' ' + l.packages[''].version")"
          echo "package.json version: $actual"
          if [[ "$lock" != "$actual $actual" ]]; then
            echo "::error::package-lock.json ($lock) doesn't match package.json ($actual). Run npm install."
            exit 1
          fi
          if [[ -n "$expected" && "$actual" != "$expected" ]]; then
            echo "::error::package.json says $actual, but the release is $expected."
            exit 1
          fi

      # npm pack, not npm publish --dry-run: npm 11 fails a publish dry run when the version is already on npm.
      - name: Pack without publishing
        run: |
          npm run build
          npm pack --dry-run

      - name: Read the release notes from the tag
        if: github.event_name == 'push'
        run: |
          # Fetch the tag object itself, so an annotated tag stays annotated.
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::${GITHUB_REF_NAME} isn't an annotated tag, so it has no release notes. Create it with git tag -a."
            exit 1
          fi
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Tag ${GITHUB_REF_NAME} has no release notes. Write them in the tag message, below the subject line."
            exit 1
          fi
          cat release-notes.md

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm 11 (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11

      - run: npm ci

      # The CLI has no prepack script, so build before publishing.
      - run: npm run build

      - name: Publish to npm (trusted publishing, with provenance)
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$(npm view "@screenshotscout/cli@$version" version 2>/dev/null)" == "$version" ]]; then
            echo "@screenshotscout/cli $version is already on npm."
            exit 0
          fi
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--tag next); fi
          npm publish "${flags[@]}"

      - name: Wait until npm serves the new version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 60); do
            if [[ "$(npm view "@screenshotscout/cli@$version" version 2>/dev/null)" == "$version" ]]; then
              echo "@screenshotscout/cli $version is live on npm."
              exit 0
            fi
            sleep 10
          done
          echo "::error::@screenshotscout/cli $version isn't visible on npm after 10 minutes."
          exit 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The GitHub release for $GITHUB_REF_NAME already exists."
            exit 0
          fi
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Screenshot Scout CLI v$version" --notes-file release-notes.md "${flags[@]}"
